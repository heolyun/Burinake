apiVersion: apps/v1
kind: Deployment
metadata:
  name: yolo-server
  namespace: burinake
  labels:
    app: yolo-server
    app.kubernetes.io/name: yolo-server
    app.kubernetes.io/part-of: burinake
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yolo-server
  template:
    metadata:
      labels:
        app: yolo-server
        app.kubernetes.io/name: yolo-server
        app.kubernetes.io/part-of: burinake
    spec:
      containers:
        - name: yolo-server
          image: burinakeacr.azurecr.io/burinake-yolo-server:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: APP_ENV
              value: "prod"
            - name: MODEL_PATH
              valueFrom:
                configMapKeyRef:
                  name: burinake-config
                  key: YOLO_MODEL_PATH
          volumeMounts:
            - name: yolo-models
              mountPath: /app/models
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: yolo-models
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: yolo-server
  namespace: burinake
  labels:
    app: yolo-server
    app.kubernetes.io/name: yolo-server
    app.kubernetes.io/part-of: burinake
spec:
  type: ClusterIP
  selector:
    app: yolo-server
  ports:
    - name: http
      port: 8001
      targetPort: http
