apiVersion: apps/v1
kind: Deployment
metadata:
  name: yolo-server
  namespace: burinake
  labels:
    app: yolo-server
    app.kubernetes.io/name: yolo-server
    app.kubernetes.io/part-of: burinake
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: yolo-server
  template:
    metadata:
      labels:
        app: yolo-server
        app.kubernetes.io/name: yolo-server
        app.kubernetes.io/part-of: burinake
    spec:
      containers:
        - name: yolo-server
          image: burinakeacr.azurecr.io/burinake-ai-server:v2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: yolo-server
  namespace: burinake
  labels:
    app: yolo-server
    app.kubernetes.io/name: yolo-server
    app.kubernetes.io/part-of: burinake
spec:
  type: ClusterIP
  selector:
    app: yolo-server
  ports:
    - name: http
      port: 8001
      targetPort: http
