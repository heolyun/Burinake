apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-schema-init
  namespace: burinake
  labels:
    app.kubernetes.io/name: postgres-schema-init
    app.kubernetes.io/part-of: burinake
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-schema-init
        app.kubernetes.io/part-of: burinake
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: burinake-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: burinake-config
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: burinake-runtime-secret
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "waiting for postgres"
                sleep 2
              done
              psql -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f /schema/001_init.sql
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
            - name: keyvault-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: burinake-db-schema
        - name: keyvault-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: burinake-keyvault-secrets
