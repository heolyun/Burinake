apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: burinake-keyvault-secrets
  namespace: burinake
  labels:
    app.kubernetes.io/name: burinake-keyvault-secrets
    app.kubernetes.io/part-of: burinake
spec:
  provider: azure
  secretObjects:
    - secretName: burinake-runtime-secret
      type: Opaque
      data:
        - objectName: postgres-password
          key: POSTGRES_PASSWORD
        - objectName: azure-storage-connection-string
          key: AZURE_STORAGE_CONNECTION_STRING
        - objectName: azure-openai-endpoint
          key: AZURE_OPENAI_ENDPOINT
        - objectName: azure-openai-api-key
          key: AZURE_OPENAI_API_KEY
        - objectName: azure-openai-deployment-name
          key: AZURE_OPENAI_DEPLOYMENT_NAME
        - objectName: azure-openai-api-version
          key: AZURE_OPENAI_API_VERSION
  parameters:
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "63cfe82a-8672-4d53-82cd-eb4aba3a2f2c"
    keyvaultName: "burinake-kv-368x19"
    tenantId: "3da85eb2-33fa-45ff-b012-e413d0c7297d"
    objects: |
      array:
        - |
          objectName: postgres-password
          objectType: secret
        - |
          objectName: azure-storage-connection-string
          objectType: secret
        - |
          objectName: azure-openai-endpoint
          objectType: secret
        - |
          objectName: azure-openai-api-key
          objectType: secret
        - |
          objectName: azure-openai-deployment-name
          objectType: secret
        - |
          objectName: azure-openai-api-version
          objectType: secret
