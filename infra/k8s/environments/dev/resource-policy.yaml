apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-safety-quota
  namespace: burinake-dev
  labels:
    app.kubernetes.io/name: burinake
    app.kubernetes.io/part-of: burinake
    app.kubernetes.io/environment: dev
spec:
  hard:
    pods: "8"
    requests.cpu: "800m"
    requests.memory: 1Gi
    limits.cpu: "1500m"
    limits.memory: 2Gi
    services.loadbalancers: "0"
    services.nodeports: "1"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: dev-default-limits
  namespace: burinake-dev
  labels:
    app.kubernetes.io/name: burinake
    app.kubernetes.io/part-of: burinake
    app.kubernetes.io/environment: dev
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 64Mi
      default:
        cpu: 250m
        memory: 256Mi
