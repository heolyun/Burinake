services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8080}
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      BURINAKE_TEST_IMAGE_DIR: /app/test-images
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-burinake}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-burinake}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-burinake_dev_password}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_BLOB_CONTAINER: ${AZURE_BLOB_CONTAINER:-fire-events}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:-Burinake-vlm}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-02-15-preview}
      AZURE_OPENAI_MAX_COMPLETION_TOKENS: ${AZURE_OPENAI_MAX_COMPLETION_TOKENS:-4000}
      AI_YOLO_BASE_URL: ${AI_YOLO_BASE_URL:-http://yolo-server:8000}
      AI_VLM_BASE_URL: http://vlm-server:8002
    depends_on:
      - postgres
      - azurite
      - yolo-server
      - vlm-server
    volumes:
      - ./snapshot2:/app/test-images:ro
      - backend_local_storage:/tmp/burinake-storage

  yolo-server:
    image: burinakeacr.azurecr.io/burinake-ai-server:v2
    ports:
      - "${YOLO_SERVER_PORT:-8001}:8000"
    environment:
      APP_ENV: dev

  vlm-server:
    build:
      context: ./ai/vlm-server
      dockerfile: Dockerfile
    ports:
      - "${VLM_SERVER_PORT:-8002}:8002"
    environment:
      APP_ENV: dev
      MODEL_PROVIDER: local
    volumes:
      - ./ai/vlm-server:/app
      - ${VLM_MODEL_DIR:-/opt/burinake/models/vlm}:/app/models

  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-burinake}
      POSTGRES_USER: ${POSTGRES_USER:-burinake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-burinake_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./database/seed/001_dev_seed.sql:/docker-entrypoint-initdb.d/002_dev_seed.sql:ro

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.31.0
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --disableProductStyleUrl
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data
    environment:
      AZURITE_ACCOUNTS: devstoreaccount1:YXp1cml0ZS1kZXYta2V5
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const net=require('net'); const s=net.connect(10000,'127.0.0.1',()=>{s.end(); process.exit(0)}); s.on('error',()=>process.exit(1));\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  frontend_node_modules:
  postgres_data:
  azurite_data:
  backend_local_storage:
