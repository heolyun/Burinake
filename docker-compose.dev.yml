services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8080}
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-burinake}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-burinake}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-burinake_dev_password}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-UseDevelopmentStorage=true}
      AZURE_BLOB_CONTAINER: ${AZURE_BLOB_CONTAINER:-fire-events}
      AI_YOLO_BASE_URL: http://yolo-server:8001
      AI_VLM_BASE_URL: http://vlm-server:8002
    depends_on:
      - postgres
      - yolo-server
      - vlm-server

  yolo-server:
    build:
      context: ./ai/yolo-server
      dockerfile: Dockerfile
    ports:
      - "${YOLO_SERVER_PORT:-8001}:8001"
    environment:
      APP_ENV: dev
      MODEL_PATH: /app/models/yolo-fire.pt
    volumes:
      - ./ai/yolo-server:/app

  vlm-server:
    build:
      context: ./ai/vlm-server
      dockerfile: Dockerfile
    ports:
      - "${VLM_SERVER_PORT:-8002}:8002"
    environment:
      APP_ENV: dev
      MODEL_PROVIDER: local
    volumes:
      - ./ai/vlm-server:/app

  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-burinake}
      POSTGRES_USER: ${POSTGRES_USER:-burinake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-burinake_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./database/seed/001_dev_seed.sql:/docker-entrypoint-initdb.d/002_dev_seed.sql:ro

volumes:
  frontend_node_modules:
  postgres_data:
