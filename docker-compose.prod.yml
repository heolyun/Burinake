services:
  frontend:
    image: ${ACR_LOGIN_SERVER}/burinake-frontend:latest
    depends_on:
      - backend

  backend:
    image: ${ACR_LOGIN_SERVER}/burinake-backend:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_BLOB_CONTAINER: ${AZURE_BLOB_CONTAINER}
      AI_YOLO_BASE_URL: http://yolo-server:8001
      AI_VLM_BASE_URL: http://vlm-server:8002
    depends_on:
      - postgres
      - yolo-server
      - vlm-server

  yolo-server:
    image: ${ACR_LOGIN_SERVER}/burinake-yolo-server:latest
    environment:
      APP_ENV: prod
      MODEL_PATH: /app/models/yolo-fire.pt
    volumes:
      - ${YOLO_MODEL_DIR:-/opt/burinake/models/yolo}:/app/models

  vlm-server:
    image: ${ACR_LOGIN_SERVER}/burinake-vlm-server:latest
    environment:
      APP_ENV: prod
      MODEL_PROVIDER: ${MODEL_PROVIDER:-azure-openai}
    volumes:
      - ${VLM_MODEL_DIR:-/opt/burinake/models/vlm}:/app/models

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-burinake}
      POSTGRES_USER: ${POSTGRES_USER:-burinake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
