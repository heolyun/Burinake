services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    image: burinake/frontend:${IMAGE_TAG:-latest}
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    image: burinake/backend:${IMAGE_TAG:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_BLOB_CONTAINER: ${AZURE_BLOB_CONTAINER}
      AI_YOLO_BASE_URL: http://yolo-server:8001
      AI_VLM_BASE_URL: http://vlm-server:8002
    depends_on:
      - yolo-server
      - vlm-server

  yolo-server:
    build:
      context: ./ai/yolo-server
      dockerfile: Dockerfile
    image: burinake/yolo-server:${IMAGE_TAG:-latest}
    environment:
      APP_ENV: prod
      MODEL_PATH: /app/models/yolo-fire.pt

  vlm-server:
    build:
      context: ./ai/vlm-server
      dockerfile: Dockerfile
    image: burinake/vlm-server:${IMAGE_TAG:-latest}
    environment:
      APP_ENV: prod
      MODEL_PROVIDER: ${MODEL_PROVIDER:-azure-openai}

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
